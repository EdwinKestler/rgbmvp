# Dependabot version updates. Alerts (security notifications) are enabled
# separately in repo Settings → Code security. This file opens weekly PRs
# to bump dependencies across the three ecosystems this repo uses.
version: 2
updates:
  # Rust workspace (Cargo.lock). The vendored `rgb-consensus-patched` and the
  # `[patch.crates-io]` redirect are local paths, so Dependabot leaves them
  # alone and only bumps crates.io dependencies.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(cargo)"

  # Python glue (pyproject.toml).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(pip)"

  # GitHub Actions pinned in .github/workflows/*.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(actions)"
